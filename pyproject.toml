[project]
name = "autokaraoke"
version = "1.0.0"
description = "Semi-automatic karaoke track generator with syllable-level sync"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyphen>=0.15",
    "langdetect>=1.0.9",
    # Text measurement for the bouncing ball (matches libass layout).
    "pillow>=10",
]

[project.optional-dependencies]
# Audio download from YouTube / YT Music. Not shipped in release builds.
download = ["yt-dlp"]
# Vocal separation (UVR models via python-audio-separator).
# audioread is imported by audio-separator but no longer pulled in transitively.
# torch / torchvision are listed so that Windows gets the CUDA build (see tool.uv.sources).
separation = ["audio-separator[gpu]>=0.30", "audioread", "torch", "torchvision"]
# Automatic word/syllable alignment.
align = ["qwen-asr", "librosa>=0.10", "uroman", "num2words", "torch"]
gui = ["PySide6>=6.7"]
all = ["autokaraoke[download,separation,align,gui]"]

[project.scripts]
autokaraoke = "autokaraoke.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI has CUDA builds of torch for Linux only; Windows gets them from the PyTorch index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/autokaraoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
