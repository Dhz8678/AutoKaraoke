[project]
name = "autokaraoke"
version = "0.1.0"
description = "Semi-automatic karaoke track generator with syllable-level sync"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyphen>=0.15",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Audio download from YouTube / YT Music. Not shipped in release builds.
download = ["yt-dlp"]
# Vocal separation (UVR models via python-audio-separator).
# audioread is imported by audio-separator but no longer pulled in transitively.
separation = ["audio-separator[gpu]>=0.30", "audioread"]
# Automatic word/syllable alignment.
align = ["qwen-asr", "librosa>=0.10", "uroman", "num2words"]
gui = ["PySide6>=6.7"]
all = ["autokaraoke[download,separation,align,gui]"]

[project.scripts]
autokaraoke = "autokaraoke.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autokaraoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
